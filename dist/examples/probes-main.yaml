# 启动、就绪与存活探针 · 三种探针的完整示例
# 前提：demo 已存在，nginx:1.28 的 / 可用；此例演示三个检查的配置位置，生产端点应按语义分别设计。
# 预期：startup 允许较长启动窗口；探针命中容器应用端点，不是通过 Service 检查其他副本。
apiVersion: v1
kind: Pod
metadata:
  name: probe-demo
  namespace: demo
spec:
  containers:
    - name: web
      image: nginx:1.28
      startupProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 5
        failureThreshold: 30
      readinessProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 5
      livenessProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 10
        failureThreshold: 3
