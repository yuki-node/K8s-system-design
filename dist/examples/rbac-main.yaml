# RBAC 与最小权限 · 命名空间内的 Pod 只读角色
# 前提：需要在 demo 创建 ServiceAccount、Role 与 RoleBinding 的权限；不授予 Secret 或日志读取权限。
# 预期：角色只允许读取 demo 的 Pod 对象；其他绑定仍可能额外授予该主体权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
