# PV、PVC 与动态存储 · PVC 消费实验
# 前提：需要支持 ReadWriteOnce 的默认 StorageClass 与可用驱动；没有默认类时需选择真实 storageClassName。此实验会申请后端存储。
# 预期：正常情况下 PVC Bound、Pod 挂载运行；删除 PVC 前先检查 PV 回收策略和后端数据处理规则。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-demo
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: volume-reader
  namespace: demo
spec:
  containers:
    - name: reader
      image: busybox:1.37
      command: [sh, -c, 'date >> /data/runs; cat /data/runs; sleep 3600']
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-demo
