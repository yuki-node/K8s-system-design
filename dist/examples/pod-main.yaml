# Pod 与容器生命周期 · 一个完整的 Pod 清单
# 前提：实验集群可拉取 nginx:1.28；保存为 pod.yaml 后 kubectl apply -f pod.yaml。
# 预期：Pod 最终应 Running 且 Ready；裸 Pod 被删除后不会由 Deployment 自动补建。
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-demo
  namespace: demo
spec:
  containers:
    - name: web
      image: nginx:1.28
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
